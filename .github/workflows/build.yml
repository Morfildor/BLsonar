name: Build APK

# Builds on every push, and whenever you press "Run workflow" in the Actions tab.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # The runner already ships the Android SDK and build-tools.
      - name: Build debug APK
        run: sh gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ble-sonar-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
